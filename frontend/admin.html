<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartShop Lite — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <nav class="nav-bar">
      <a href="index.html" class="brand">Smart<span>Shop</span></a>
      <div class="nav-links" style="margin-left:0;">
        <a href="index.html">Shop</a>
        <a href="admin.html" class="active">Admin</a>
      </div>
    </nav>
  </header>

  <main class="container admin-shell">
    <div class="admin-header">
      <div>
        <h1 style="margin-bottom:4px;">Product management</h1>
        <p style="color:var(--color-ink-soft); font-size:0.9rem;">Add, edit, and remove products from the catalog.</p>
      </div>
      <div class="admin-key-box">
        <label for="adminKeyInput">Admin key</label>
        <input type="password" id="adminKeyInput" placeholder="Enter admin key" autocomplete="off" />
      </div>
    </div>

    <div class="admin-layout">
      <!-- Form -->
      <section class="admin-card">
        <h2 id="formTitle">Add a product</h2>
        <p class="hint">Fields marked required must be filled before saving.</p>
        <form id="productForm">
          <input type="hidden" id="productId" />
          <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" required maxlength="120" />
          </div>
          <div class="form-group">
            <label for="description">Description *</label>
            <textarea id="description" rows="3" required maxlength="2000"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="price">Price ($) *</label>
              <input type="number" id="price" min="0" step="0.01" required />
            </div>
            <div class="form-group">
              <label for="stock">Stock *</label>
              <input type="number" id="stock" min="0" step="1" required />
            </div>
          </div>
          <div class="form-group">
            <label for="category">Category *</label>
            <input type="text" id="category" list="categoryList" required placeholder="e.g. Electronics" />
            <datalist id="categoryList"></datalist>
          </div>
          <div class="form-group">
            <label for="imageUrl">Image URL</label>
            <input type="url" id="imageUrl" placeholder="https://..." />
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="featured" />
            <label for="featured" style="margin:0;">Featured product</label>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="saveBtn">Save product</button>
            <button type="button" class="btn btn-outline" id="cancelEditBtn" style="display:none;">Cancel edit</button>
          </div>
        </form>
      </section>

      <!-- Table -->
      <section>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="productTableBody">
              <tr><td colspan="6" style="text-align:center;padding:24px;">Loading products...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="adminPagination"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">SmartShop Lite &mdash; a demo e-commerce app built with Node.js, Express &amp; MongoDB.</div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
